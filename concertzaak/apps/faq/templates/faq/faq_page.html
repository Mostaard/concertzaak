{% extends "base.html" %}
{% load static wagtailcore_tags %}

{% block extra_css %}
    <link rel='stylesheet' type='text/css' href="{% static 'faq/faq.css' %}">
{% endblock %}

{% block body_class %}faq-body{% endblock %}

{% block content %}
    <main class="faq-page">
        <a class="faq-page__back" href="{{ page.get_parent.url }}">Terug naar FAQ</a>
        <article class="faq-page__content rich-text">
            <h1>{{ page.title }}</h1>
            {{ page.long_text|richtext }}
        </article>
    </main>
{% endblock %}
